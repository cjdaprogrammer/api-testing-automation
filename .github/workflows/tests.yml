name: API Testing Automation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest API tests with coverage
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-api-test-reports
          path: |
            reports/report.html
            reports/coverage/
          if-no-files-found: warn

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Run Postman API collection
        run: |
          postman collection run ./postman/Task_Management_API.postman_collection.json \
            --no-report-events \
            --output ./reports/postman
